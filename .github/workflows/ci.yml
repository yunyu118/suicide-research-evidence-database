name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src scripts tests

      - name: Test
        # Network-marked tests are excluded: CI must not depend on the
        # availability or rate limits of external bibliographic APIs.
        run: pytest -m "not network" --cov=sred --cov-report=term-missing

  pipeline-smoke:
    name: Pipeline smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run integrate -> classify -> analyse on the fixture corpus
        run: |
          python tests/make_fixture.py
          python scripts/02_integrate.py --channels fixture
          python scripts/03_classify.py --skip-validation
          python scripts/04_analyze.py
      - name: Check expected outputs exist
        run: |
          test -f data/processed/sred_classified.parquet
          test -f data/processed/results.json
          test -f figures/fig1_growth.png
