[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sred"
version = "1.0.0"
description = "Suicide Research Evidence Database: an open, reproducible bibliographic infrastructure for scientometric research on suicide and suicide prevention"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "suicide", "suicide prevention", "suicidology", "bibliometrics",
    "scientometrics", "social determinants of health", "open science",
    "health informatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "rapidfuzz>=3.0",
    "PyYAML>=6.0",
    "duckdb>=0.10",
]

[project.optional-dependencies]
postgres = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
all = ["sred[postgres,dev]"]

[project.urls]
Homepage = "https://github.com/OWNER/suicide-research-evidence-database"
Repository = "https://github.com/OWNER/suicide-research-evidence-database"
Issues = "https://github.com/OWNER/suicide-research-evidence-database/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sred = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "E712", "SIM108"]
"src/sred/classify/rules.py" = ["E501"]
# `x == True` is not redundant on a pandas nullable boolean column: `is True`
# is wrong and bare truthiness treats <NA> as False, which silently folds
# "unclassified" into "not empirical".
"src/sred/analysis/metrics.py" = ["E712", "SIM108"]
# Label accumulation reads better as aligned one-liners than as 3x the lines.
"src/sred/classify/distant.py" = ["E702"]
"src/sred/sources/scopus.py" = ["E741"]
